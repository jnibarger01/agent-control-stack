# Jace Commander service identities (systemd-sysusers). Each process runs as its own unprivileged
# account and reads only its own credentials. Apply with: systemd-sysusers jace-commander.conf
# (migrate-jc-identities.sh --apply does this; it never edits an existing account's shell or groups).
#
#  jc-edge     public HTTPS ingress (route allowlist). No secrets, no writable state.
#  jc-gateway  OAuth authorization server + ACS capability REQUESTER. Holds OAuth signing and ACS gateway tokens.
#  jc-bridge   MCP bridge. Holds only the gateway-attestation secret. Never sees an ACS token.
#  jc-exec     Executor (Desktop Commander, Jace Commander profile). Runs with NO secrets and no supplementary groups.
#
# Desktop-user execution (the executor acting as an interactive desktop account) is a host decision, not a default.
# See docs/jace-commander-service-isolation.md. Do not point JC_EXEC_USER at a human account without approval.
u jc-edge    - "Jace Commander public edge"    /var/lib/jace-commander/edge    /usr/sbin/nologin
u jc-gateway - "Jace Commander OAuth gateway" /var/lib/jace-commander/gateway /usr/sbin/nologin
u jc-bridge  - "Jace Commander MCP bridge"    /var/lib/jace-commander/bridge  /usr/sbin/nologin
u jc-exec    - "Jace Commander executor"      /var/lib/jace-commander/exec    /usr/sbin/nologin
