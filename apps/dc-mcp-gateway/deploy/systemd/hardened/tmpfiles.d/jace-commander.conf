# Runtime state for the Jace Commander services. Owned by the service that writes it, mode 0700,
# so no other service identity can read or replace its state. The policy directory is root-owned.
#
# Type Path                               Mode  User       Group      Age
d       /var/lib/jace-commander           0755  root       root       -
d       /var/lib/jace-commander/edge      0700  jc-edge    jc-edge    -
d       /var/lib/jace-commander/gateway   0700  jc-gateway jc-gateway -
d       /var/lib/jace-commander/bridge    0700  jc-bridge  jc-bridge  -
d       /var/lib/jace-commander/exec      0700  jc-exec    jc-exec    -
d       /etc/jace-commander               0755  root       root       -
