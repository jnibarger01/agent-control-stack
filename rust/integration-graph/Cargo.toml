[package]
name = "acs-integration-graph"
version = "0.1.0"
edition = "2024"
publish = false
description = "ACS integration graph kernel and versioned Node-API bridge"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6", "dyn-symbols"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
