[package]
name = "acs-scope-supervisor"
version = "0.1.0"
edition = "2024"
publish = false
description = "ACS Linux scope supervisor: termination coordinator (v1) and attempt-bound live supervisor (v2)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.29", default-features = false, features = ["signal", "fs"] }
