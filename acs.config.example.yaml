# Canonical local runtime topology for `acs serve`.
# Policy, approval, credentials, and adapter-specific configuration stay in
# their existing ACS configuration and environment contracts.
runtime:
  db_path: storage/local.db
  scheduler_interval_ms: 60000
  worker_interval_ms: 5000
  reconcile_interval_ms: 30000
  worker_id: local-runtime-worker
  status_port: 3001

gateway:
  host: 127.0.0.1
  port: 3000
