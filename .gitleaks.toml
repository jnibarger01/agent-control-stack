[extend]
useDefault = true

[allowlist]
description = "Generated state and explicit non-secret development fixtures"
regexTarget = "match"
paths = [
  '''(^|/)dist/''',
  '''(^|/)\.ijfw/''',
  '''(^|/)apps/gateway/src/server\.test\.ts$''',
  '''(^|/)packages/engine-adapter/src/registry\.test\.ts$''',
  '''(^|/)packages/execution-controller/src/index\.test\.ts$''',
  '''(^|/)packages/agentos-contracts/test/trace\.test\.js$''',
  '''(^|/)packages/work-items/src/validation\.test\.ts$''',
  '''(^|/)scripts/test_autonomous_agent\.py$''',
  '''(^|/)docs/openai-compatible-inference\.md$''',
  # Desktop Commander fixtures: a random OAuth client UUID and the canonical
  # fake AWS key AKIAABCDEFGHIJKLMNOP used as secret_scan test input.
  '''(^|/)apps/dc-relay/test/test-control-plane-pairing\.js$''',
  '''(^|/)vendor/desktop-commander/test/test-execution-tools\.js$'''
]
regexes = [
  '''(?i)authorization:\s*bearer\s+(?:change-me-local-dev|local-dev-token)''',
  '''(?i)authorization:\s*bearer['`;]?$'''
]
