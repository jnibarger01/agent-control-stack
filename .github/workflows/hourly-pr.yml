name: Hourly Pull Request Cycle

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read

concurrency:
  group: hourly-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore task ledger
        uses: actions/cache/restore@v4
        with:
          path: .automation/state/tasks.db
          key: hourly-pr-ledger-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hourly-pr-ledger-${{ github.repository_id }}-

      - name: Preflight
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/hourly_pr.py preflight

      - name: Protect runtime state
        run: echo ".automation/runtime-result.json" >> .git/info/exclude

      - name: Build prompt
        if: steps.preflight.outputs.mode != 'skip'
        id: prompt
        env:
          REPOSITORY: ${{ github.repository }}
          CYCLE_ID: ${{ steps.preflight.outputs.cycle_id }}
          CATEGORY: ${{ steps.preflight.outputs.category }}
          MODE: ${{ steps.preflight.outputs.mode }}
          OPEN_PRS: ${{ steps.preflight.outputs.open_automated_prs }}
          DEFAULT_BRANCH: ${{ steps.preflight.outputs.default_branch }}
          MAIN_CI: ${{ steps.preflight.outputs.latest_main_ci }}
        run: |
          {
            echo 'prompt<<EOF'
            cat .automation/hourly-pr-prompt.md
            echo
            echo '## Runtime context'
            echo "- repository: $REPOSITORY"
            echo "- cycle_id: $CYCLE_ID"
            echo "- scheduled_category: $CATEGORY"
            echo "- mode: $MODE"
            echo "- open_automated_prs: $OPEN_PRS"
            echo "- default_branch: $DEFAULT_BRANCH"
            echo "- latest_default_branch_ci: $MAIN_CI"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run engineering worker
        if: steps.preflight.outputs.mode != 'skip'
        id: opencode
        uses: anomalyco/opencode/github@31406ccc51b4bd2a4e1e086b2bcaa5f7f804f26d
        env:
          FREEMODEL_API_KEY: ${{ secrets.FREEMODEL_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: freemodel/gpt-5.5
          use_github_token: true
          share: false
          prompt: ${{ steps.prompt.outputs.prompt }}

      - name: Enforce worker gates
        if: always() && steps.preflight.outputs.idempotency_key != ''
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CYCLE_ID: ${{ steps.preflight.outputs.cycle_id }}
          CYCLE_MODE: ${{ steps.preflight.outputs.mode }}
        run: python3 scripts/hourly_pr.py verify

      - name: Reconcile cycle
        if: always() && steps.preflight.outputs.idempotency_key != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IDEMPOTENCY_KEY: ${{ steps.preflight.outputs.idempotency_key }}
          CYCLE_ID: ${{ steps.preflight.outputs.cycle_id }}
          CYCLE_MODE: ${{ steps.preflight.outputs.mode }}
          ACTION_OUTCOME: ${{ steps.opencode.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: python3 scripts/hourly_pr.py reconcile

      - name: Persist task ledger
        if: always() && steps.preflight.outputs.idempotency_key != ''
        uses: actions/cache/save@v4
        with:
          path: .automation/state/tasks.db
          key: hourly-pr-ledger-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
