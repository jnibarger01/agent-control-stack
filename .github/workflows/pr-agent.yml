name: PR Agent

# Automated PR Agent reviews are disabled. Keep manual dispatch available
# for an operator after configuring the provider key; no CI bypass or fake pass.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-review:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Review pull request
        uses: the-pr-agent/pr-agent@8257f6adb2514889fe2f3a96f332a010a4c36538
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
