name: format-debug
on:
  push:
    branches:
      - feat/live-mission-control

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier --write apps/gateway/src/public-contracts.ts apps/gateway/src/server.ts
          git diff -- apps/gateway/src/public-contracts.ts apps/gateway/src/server.ts
          test -z "$(git status --short -- apps/gateway/src/public-contracts.ts apps/gateway/src/server.ts)"
