name: PR merge gate (disabled)

# HOTFIX: this gate used to review and merge pull requests with a token. It is
# disabled. It never merges, never enables auto-merge, and holds no credentials.
# It fails closed so the check cannot be mistaken for an approval.
# Merges are manual until the trusted classifier in #432 is verified.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  review-and-merge:
    name: PR review and merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Gate disabled
        shell: bash
        run: |
          echo "Automated review and merge is disabled. Merge only after an independent human review." >&2
          exit 1
