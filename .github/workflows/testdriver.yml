name: Vitest Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.16.0'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build workspace packages
      run: npm run build

    - name: Run Vitest
      run: npx vitest run
