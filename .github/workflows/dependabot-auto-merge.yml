name: Dependabot auto-merge (disabled)

# HOTFIX: disabled. This workflow used to enable auto-merge for dependency bumps
# without independent human review. It has been removed from the active path.
# It is kept as a no-op so the decision is visible in history. Re-enable only
# through the trusted classifier once it is verified.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  dependabot:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Disabled
        run: exit 1
