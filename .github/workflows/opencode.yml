name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) &&
      (
        startsWith(format('{0} ', github.event.comment.body), '/oc ') ||
        startsWith(format('{0} ', github.event.comment.body), '/opencode ')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@5e75e5e9901f0d178f425bfb47f1bd46cbe78a59 # pinned review commit
        env:
          FREEMODEL_API_KEY: ${{ secrets.FREEMODEL_API_KEY }}
        with:
          model: freemodel/gpt-5.5
