name: check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Prettier diagnostics
        run: |
          npx prettier --write apps/gateway/src/public-contracts.ts apps/gateway/src/server.ts
          git diff -- apps/gateway/src/public-contracts.ts apps/gateway/src/server.ts
          exit 1

      - name: Build and test
        run: npm run check

      - name: Coverage gate
        run: npm run test:coverage

      - name: Secret scan
        run: npm run security:secrets

      - name: Build production image
        run: docker build -t agent-control-stack:${{ github.sha }} .

      # Hard-fail on GitHub-hosted runners (ubuntu-latest has Docker).
      # Loopback publish only; no Vercel APIs or ignoreCommand changes.
      - name: Compose production smoke
        env:
          ACS_IMAGE_TAG: ${{ github.sha }}
        run: ./scripts/ci-compose-production-smoke.sh
