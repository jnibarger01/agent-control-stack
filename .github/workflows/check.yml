name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: acs-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run check

      - name: Coverage gate
        run: npm run test:coverage

      - name: Secret scan
        run: npm run security:secrets

      - name: Release smoke with temporary database
        run: npm run test:release-smoke

      - name: Build production image
        run: docker build -t agent-control-stack:${{ github.sha }} .

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acs-coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
