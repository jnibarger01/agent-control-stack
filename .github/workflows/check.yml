name: check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Classify pull request
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          non_docs="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files" --paginate             --jq '.[] | select(((.filename | endswith(".md")) | not) and ((.filename | startswith("docs/")) | not)) | .filename'             | head -n 1)"
          if [[ -z "$non_docs" ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docs-only fast path
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "Documentation-only pull request; required check satisfied without runtime validation."

      - name: Checkout
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm

      - name: Pin npm
        if: steps.changes.outputs.docs_only != 'true'
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Build and test
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run check

      - name: Coverage gate
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run test:coverage

      - name: Secret scan
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run security:secrets

      - name: Build production image
        if: steps.changes.outputs.docs_only != 'true'
        run: docker build -t agent-control-stack:${{ github.sha }} .

      # Hard-fail on GitHub-hosted runners (ubuntu-latest has Docker).
      # Loopback publish only; no Vercel APIs or ignoreCommand changes.
      - name: Compose production smoke
        if: steps.changes.outputs.docs_only != 'true'
        env:
          ACS_IMAGE_TAG: ${{ github.sha }}
        run: ./scripts/ci-compose-production-smoke.sh
