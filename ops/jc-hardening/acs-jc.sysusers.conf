# Jace Commander service identities (systemd-sysusers). Each process runs as its own unprivileged account and
# reads only its own secrets. Apply with: systemd-sysusers acs-jc.sysusers.conf
# (migrate-acs-jc-identities.sh --apply does this; it never edits an existing account).
#
#  acs-ingress   public HTTPS ingress (edge/ingress.js). No secrets.
#  acs-edge      OAuth gateway. Holds the OAuth signing key, consent passphrase, attestation secret, and ACS JC gateway token.
#  acs-jc        MCP bridge. Holds the attestation secret, the Ed25519 SIGNING key, and its ACS worker token.
#  acs-jc-exec   executor, started by the bridge through setpriv. Holds NO secrets.
#
# Desktop-user execution (the executor acting as an interactive desktop account) is a host decision, not a default.
u acs-ingress  - "Jace Commander public ingress"  /var/lib/acs-ingress  /usr/sbin/nologin
u acs-edge     - "Jace Commander OAuth gateway"   /var/lib/acs-edge     /usr/sbin/nologin
u acs-jc       - "Jace Commander MCP bridge"      /var/lib/acs-jc       /usr/sbin/nologin
u acs-jc-exec  - "Jace Commander executor"        /var/lib/acs-jc-exec  /usr/sbin/nologin
